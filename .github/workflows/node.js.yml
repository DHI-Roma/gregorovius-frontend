# Builds the frontend and runs unit and end-to-end tests.
# E2E tests use recorded API fixtures (tests/e2e/fixtures/api) and never call the live API.

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.22.x
        cache: npm
    - run: cp env.dist.js env.js
    - run: npm ci
    - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.22.x
        cache: npm
    - name: Install xsltproc (used by the mock API, same libxslt engine as the API)
      run: sudo apt-get update && sudo apt-get install -y xsltproc
    - run: cp env.dist.js env.js
    - run: npm ci
    - run: npx playwright install --with-deps chromium webkit
    - run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
